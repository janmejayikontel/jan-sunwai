name: Build Native Jan Sunwai Mobile APK (LiveKit & Screen Share)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-mobile-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Mobile Dependencies
        working-directory: mobile
        run: npm install --legacy-peer-deps

      - name: Grant Execute Permission for Gradlew
        run: chmod +x mobile/android/gradlew

      - name: Build Android APK
        working-directory: mobile/android
        run: ./gradlew assembleRelease --no-daemon -Pandroid.minSdkVersion=24 --stacktrace

      - name: Upload Jan Sunwai Mobile APK
        uses: actions/upload-artifact@v4
        with:
          name: JanSunwai-Native-LiveKit-Mobile-APK
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
