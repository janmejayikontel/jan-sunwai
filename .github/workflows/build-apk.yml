name: Build Jan Sunwai Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install Web Dependencies
        working-directory: web
        run: npm ci

      - name: Build Next.js Web App
        working-directory: web
        run: npm run build

      - name: Sync Capacitor Android
        working-directory: web
        run: npx cap sync android

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant Execute Permission for Gradlew
        run: chmod +x web/android/gradlew

      - name: Build Android Debug APK
        working-directory: web/android
        run: ./gradlew assembleDebug

      - name: Upload Jan Sunwai APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: JanSunwai-Android-APK
          path: web/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
